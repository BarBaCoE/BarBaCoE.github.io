<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Ship's Bell Main Body -->
  <g transform="translate(200, 200)">
    <!-- Bell Crown/Top -->
    <ellipse cx="0" cy="-80" rx="15" ry="8" fill="#8b4513" stroke="#654321" stroke-width="2"/>
    
    <!-- Bell Suspension Loop -->
    <path d="M -10,-88 Q 0,-95 10,-88" fill="none" stroke="#654321" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Main Bell Body -->
    <path d="M -60,-70 Q -65,-60 -65,-40 Q -65,-20 -70,0 Q -75,20 -80,40 Q -85,60 -90,80 L 90,80 Q 85,60 80,40 Q 75,20 70,0 Q 65,-20 65,-40 Q 65,-60 60,-70 Z" 
          fill="#cd853f" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Bell Rim/Base -->
    <ellipse cx="0" cy="80" rx="90" ry="12" fill="#8b4513" stroke="#654321" stroke-width="2"/>
    
    <!-- Bell Highlights -->
    <path d="M -50,-65 Q -55,-55 -55,-35 Q -55,-15 -60,5 Q -65,25 -70,45" 
          fill="none" stroke="#deb887" stroke-width="2" opacity="0.7"/>
    
    <!-- D.S.A. Pattern - Naval Anchor -->
    <g transform="scale(0.8)">
      <!-- Anchor Shaft -->
      <line x1="0" y1="-20" x2="0" y2="40" stroke="#2c3e50" stroke-width="4"/>
      
      <!-- Anchor Crown/Top -->
      <circle cx="0" cy="-20" r="6" fill="none" stroke="#2c3e50" stroke-width="3"/>
      
      <!-- Anchor Arms -->
      <path d="M -25,35 L 0,40 L 25,35" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Anchor Flukes -->
      <path d="M -25,35 L -35,45 L -30,50 L -20,40" fill="#2c3e50"/>
      <path d="M 25,35 L 35,45 L 30,50 L 20,40" fill="#2c3e50"/>
      
      <!-- Anchor Stock (crossbar) -->
      <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#2c3e50" stroke-width="3"/>
      <circle cx="-20" cy="-5" r="3" fill="#2c3e50"/>
      <circle cx="20" cy="-5" r="3" fill="#2c3e50"/>
    </g>
    
    <!-- D.S.A. Text -->
    <text x="0" y="110" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#2c3e50">D.S.A.</text>
    
    <!-- Rope/Chain Detail -->
    <g opacity="0.6">
      <circle cx="-15" cy="-95" r="2" fill="#654321"/>
      <circle cx="-10" cy="-100" r="2" fill="#654321"/>
      <circle cx="-5" cy="-102" r="2" fill="#654321"/>
      <circle cx="0" cy="-103" r="2" fill="#654321"/>
      <circle cx="5" cy="-102" r="2" fill="#654321"/>
      <circle cx="10" cy="-100" r="2" fill="#654321"/>
      <circle cx="15" cy="-95" r="2" fill="#654321"/>
    </g>
    
    <!-- Bell Clapper -->
    <ellipse cx="0" cy="60" rx="8" ry="15" fill="#696969" stroke="#2f4f4f" stroke-width="1"/>
    <line x1="0" y1="-70" x2="0" y2="45" stroke="#2f4f4f" stroke-width="2"/>
    
    <!-- Decorative Bands on Bell -->
    <ellipse cx="0" cy="-30" rx="58" ry="3" fill="none" stroke="#8b4513" stroke-width="1"/>
    <ellipse cx="0" cy="10" rx="65" ry="3" fill="none" stroke="#8b4513" stroke-width="1"/>
    <ellipse cx="0" cy="50" rx="72" ry="3" fill="none" stroke="#8b4513" stroke-width="1"/>
    
    <!-- Maritime Stars (traditional naval decoration) -->
    <g transform="translate(-40, -10)">
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="#2c3e50" opacity="0.7"/>
    </g>
    <g transform="translate(40, -10)">
      <polygon points="0,-5 1.5,-1.5 5,0 1.5,1.5 0,5 -1.5,1.5 -5,0 -1.5,-1.5" fill="#2c3e50" opacity="0.7"/>
    </g>
    
    <!-- Additional D.S.A. Elements - Compass Rose -->
    <g transform="translate(0, 25) scale(0.3)" opacity="0.4">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#2c3e50" stroke-width="2"/>
      <polygon points="0,-18 3,-6 0,-8 -3,-6" fill="#2c3e50"/>
      <text x="0" y="25" text-anchor="middle" font-family="serif" font-size="12" font-weight="bold" fill="#2c3e50">N</text>
    </g>
  </g>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="320" rx="70" ry="15" fill="black" opacity="0.2"/>
  
  <!-- Title -->
  <text x="200" y="50" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#2c3e50">Ship's Bell - D.S.A. Pattern</text>
  
  <!-- Maritime Border -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#2c3e50" stroke-width="3" stroke-dasharray="10,5"/>
</svg>